name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: arqus, POSTGRES_PASSWORD: arqus, POSTGRES_DB: arqus_test }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U arqus" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_MIGRATE_URL: postgres://arqus:arqus@127.0.0.1:5433/arqus_test
      TEST_DATABASE_URL: postgres://arqus_app:arqus@127.0.0.1:5433/arqus_test
      # WP1.20: S3 pohrana i kopije izvan poslužitelja nad MinIO-m (scripts/minio-test.sh; testne vjerodajnice)
      TEST_S3_ENDPOINT: http://127.0.0.1:9100
      TEST_S3_ACCESS_KEY_ID: arqus-test
      TEST_S3_SECRET_ACCESS_KEY: arqus-test-secret-123
      # WP1.21: SMTP klijent i slanje pozivnice nad stvarnim SMTP poslužiteljem (scripts/smtp-test.sh; testne vjerodajnice)
      TEST_SMTP_PORT: "1125"
      TEST_SMTP_API: http://127.0.0.1:8125
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Ranjivosti ovisnosti (visoke i kritične ruše CI)
        run: pnpm audit --prod --audit-level high
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - name: MinIO za testove S3 (ista naredba kao lokalno)
        run: sh scripts/minio-test.sh up
      - name: Mailpit za testove SMTP-a (ista naredba kao lokalno)
        run: sh scripts/smtp-test.sh up
      - run: pnpm test
      - name: Validacija paketa programa (shema + semantika)
        run: node packages/domain/dist/cli.js docs/domena/paketi
