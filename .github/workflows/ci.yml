name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: arqus, POSTGRES_PASSWORD: arqus, POSTGRES_DB: arqus_test }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U arqus" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_MIGRATE_URL: postgres://arqus:arqus@127.0.0.1:5433/arqus_test
      TEST_DATABASE_URL: postgres://arqus_app:arqus@127.0.0.1:5433/arqus_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Validacija paketa programa (shema + semantika)
        run: node packages/domain/dist/cli.js docs/domena/paketi
