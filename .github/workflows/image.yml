# Objava Docker slike u GitHub Container Registry (ghcr.io) – za instalacije koje sliku samo preuzimaju (NAS, pilot).
# Paket nasljeđuje privatnost repozitorija; za preuzimanje treba token s pravom read:packages (docs/NAS-INSTALACIJA.md).
name: Slika
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  objava:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64   # Synology s Intel/AMD i 64-bitnim ARM procesorom
          push: true
          tags: |
            ghcr.io/icvitic/arqus-project-mgmt:latest
            ghcr.io/icvitic/arqus-project-mgmt:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
