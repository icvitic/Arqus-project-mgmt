# DEMO okruženje ArQus Projekti na vlastitom računalu (WP1.13) – NIJE za produkciju ni za stvarne podatke.
# Pokretanje: demo.cmd (Windows) ili scripts/demo.sh (macOS/Linux); upute: docs/DEMO.md
# Lozinke i ključevi u ovoj datoteci namjerno su javni demo vrijednosti – nikad ih ne koristi u pilot-instalaciji (docs/PILOT-INSTALACIJA.md).
name: arqus-demo
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arqus
      POSTGRES_PASSWORD: demo-samo-lokalno-vlasnik   # DEMO – nije tajna
      POSTGRES_DB: arqus
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U arqus"], interval: 3s, timeout: 3s, retries: 30 }
  app:
    build: { context: ../.., dockerfile: Dockerfile }
    image: arqus-projekti-demo
    init: true
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      NODE_ENV: production
      DATABASE_MIGRATE_URL: postgres://arqus:demo-samo-lokalno-vlasnik@db:5432/arqus
      DATABASE_URL: postgres://arqus_app:demo-samo-lokalno-aplikacija@db:5432/arqus
      DB_APP_PASSWORD: demo-samo-lokalno-aplikacija                 # DEMO – nije tajna
      AUTH_JWT_SECRET: demo-samo-lokalno-jwt-NIJE-ZA-PRODUKCIJU-0123  # DEMO – nije tajna
      MFA_ENCRYPTION_KEY: demo-samo-lokalno-mfa-NIJE-ZA-PRODUKCIJU    # DEMO – nije tajna
      AUTH_TOKEN_TTL: 12h
      DOCUMENTS_DIR: /data/documents
      FT_IMPORT_INTERVAL_HOURS: "0"   # demo ne ovisi o mreži; stvarni pozivi: docker compose exec app node dist/db/cli.js import-calls
      ARQUS_DEMO: "1"                 # dopušta naredbu `demo` u produkcijskom načinu slike
      # WP1.21: e-pošta zadano isključena (poveznice pozivnica dobiva administrator). S profilom `mail` (docs/DEMO.md):
      # ARQUS_DEMO_MAIL=smtp COMPOSE_PROFILES=mail – poruke idu u lokalni hvatač pošte (Mailpit, http://localhost:8025).
      MAIL_TRANSPORT: ${ARQUS_DEMO_MAIL:-off}
      PUBLIC_URL: http://localhost:${ARQUS_DEMO_PORT:-8080}
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      SMTP_SECURITY: none            # DEMO – lokalni hvatač pošte unutar Docker mreže, bez vjerodajnica
      MAIL_FROM: projekti@pokazno-sveuciliste.local
    # Pri svakom pokretanju: migracije + paketi, zatim demo podaci (idempotentno – postojeći demo se ne dira), pa poslužitelj.
    command: ["sh", "-c", "node dist/db/cli.js init && node dist/db/cli.js demo && exec node dist/main.js"]
    volumes: ["documents:/data/documents"]
    # samo s ovog računala; port bira demo.cmd / scripts/demo.sh (prvi slobodan od 8080, 8081, 8088, 18080, 28080) ili ARQUS_DEMO_PORT
    ports: ["127.0.0.1:${ARQUS_DEMO_PORT:-8080}:3000"]
  # Lokalni hvatač pošte za demonstraciju pozivnica i dnevnog sažetka (ništa ne odlazi van). Samo uz profil `mail`.
  mail:
    image: ghcr.io/axllent/mailpit:v1.27.11
    profiles: ["mail"]
    restart: unless-stopped
    ports: ["127.0.0.1:${ARQUS_DEMO_MAIL_PORT:-8025}:8025"]
volumes: { pgdata: {}, documents: {} }
