# Lokalno razvojno okruženje (ADR-0002/0003): PostgreSQL, Redis, S3-kompatibilna pohrana (MinIO).
# Pokretanje: pnpm infra:up   ·   zaustavljanje: pnpm infra:down
name: arqus
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arqus
      POSTGRES_PASSWORD: arqus
      POSTGRES_DB: arqus
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U arqus"], interval: 5s, timeout: 3s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: arqus
      MINIO_ROOT_PASSWORD: arqus-minio
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
volumes:
  pgdata: {}
  miniodata: {}
