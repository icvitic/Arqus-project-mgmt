# Pilot-instalacija na jednom poslužitelju u EU (bilo koji pružatelj s Dockerom). Upute: docs/PILOT-INSTALACIJA.md
# Pokretanje: cp .env.example .env (popuniti) && docker compose up -d --build
name: arqus-pilot
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arqus
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?postavi DB_OWNER_PASSWORD}
      POSTGRES_DB: arqus
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U arqus"], interval: 5s, timeout: 3s, retries: 20 }
  app:
    build: { context: ../.., dockerfile: Dockerfile }
    init: true
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      NODE_ENV: production
      DATABASE_MIGRATE_URL: postgres://arqus:${DB_OWNER_PASSWORD}@db:5432/arqus
      DATABASE_URL: postgres://arqus_app:${DB_APP_PASSWORD:?postavi DB_APP_PASSWORD}@db:5432/arqus
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?postavi AUTH_JWT_SECRET (najmanje 32 znaka)}
      AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL:-8h}
      TRUST_PROXY: "uniquelocal"
    expose: ["3000"]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN:?postavi DOMAIN}", ACME_EMAIL: "${ACME_EMAIL:?postavi ACME_EMAIL}" }
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddydata:/data", "caddyconfig:/config"]
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      PGPASSWORD: ${DB_OWNER_PASSWORD}
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
    volumes: ["./backup.sh:/backup.sh:ro", "backups:/backups"]
    entrypoint: ["sh", "/backup.sh"]
volumes: { pgdata: {}, caddydata: {}, caddyconfig: {}, backups: {} }
