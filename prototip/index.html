<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArQus Projekti – prototip</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--fg:#1c2430;--muted:#66717f;--line:#dde2e8;--accent:#1f5fbf;--accent-fg:#fff;--ok:#1a7f4b;--warn:#b26a00;--bad:#b3261e;--chip:#eef2f7}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f141a;--card:#161d26;--fg:#e6ebf1;--muted:#93a0ae;--line:#2a343f;--accent:#6ea8ff;--accent-fg:#0b1220;--ok:#4cc38a;--warn:#f0b35a;--bad:#ff7b72;--chip:#1f2935}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:20px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header .brand{font-weight:700}header .brand small{color:var(--muted);font-weight:400;margin-left:8px}
nav a{color:var(--fg);text-decoration:none;padding:6px 10px;border-radius:6px;margin-right:2px}nav a.active,nav a:hover{background:var(--chip)}
header .sp{flex:1}header button{font-size:13px}
main{max-width:1180px;margin:0 auto;padding:20px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:20px 0 8px}h3{font-size:15px;margin:14px 0 6px}
.sub{color:var(--muted);margin:0 0 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.03em}
tr.row:hover{background:var(--chip);cursor:pointer}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--chip);font-size:12px;white-space:nowrap}
.chip.ok{color:var(--ok)}.chip.warn{color:var(--warn)}.chip.bad{color:var(--bad)}.chip.acc{background:var(--accent);color:var(--accent-fg)}
button,.btn{font:inherit;font-size:14px;padding:7px 12px;border-radius:7px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}button.danger{color:var(--bad)}button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}input[type=number]{width:110px;text-align:right}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}.tile .v{font-size:26px;font-weight:700}.tile .l{color:var(--muted);font-size:13px}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}.steps span{padding:4px 10px;border-radius:999px;background:var(--chip);font-size:12.5px;color:var(--muted)}.steps span.done{color:var(--ok)}.steps span.cur{background:var(--accent);color:var(--accent-fg)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}.tabs a{padding:8px 12px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent}.tabs a.active{color:var(--fg);border-bottom-color:var(--accent)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.kv{display:grid;grid-template-columns:180px 1fr;gap:4px 12px;font-size:14px}.kv b{color:var(--muted);font-weight:500}
.note{font-size:13px;color:var(--muted)}.right{text-align:right}.crumbs{font-size:13px;color:var(--muted);margin-bottom:8px}.crumbs a{color:var(--accent)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}
.range{display:flex;align-items:center;gap:10px}.range input{width:160px;padding:0}
@media(max-width:820px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}.kv{grid-template-columns:1fr}main{padding:12px}header{flex-wrap:wrap;gap:8px}}
@media(max-width:520px){.g2,.g3,.g4{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="brand">ArQus Projekti <small>prototip WP0.5 · bez backenda</small></div>
  <nav id="nav">
    <a href="#/radar">Radar poziva</a><a href="#/prijave">Prijave</a><a href="#/projekti">Projekti</a><a href="#/portfelj">Portfelj</a>
  </nav>
  <div class="sp"></div>
  <span class="note" id="tenant">Stanar: Fakultet prometnih znanosti (demo)</span>
  <button id="reset" title="Vrati demo podatke">Resetiraj podatke</button>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>
<script>
/* ====== Paketi programa (pojednostavljena kopija docs/domena/paketi/*.json) ====== */
const PACKAGES = {
  "horizon-europe-2021-2027": {
    name: "Horizon Europe 2021–2027", version: "1.0.0", currency: "EUR",
    actionTypes: { RIA: {name:"Research and Innovation Action", rate:100}, IA: {name:"Innovation Action", rate:70, rateNonProfit:100}, CSA:{name:"Coordination and Support Action", rate:100} },
    categories: [
      {code:"A", name:"Troškovi osoblja", kind:"direct"},
      {code:"B", name:"Podugovaranje", kind:"direct", warnShare:0.15},
      {code:"C.1", name:"Putovanja i dnevnice", kind:"direct"},
      {code:"C.2", name:"Oprema (amortizacija)", kind:"direct"},
      {code:"C.3", name:"Ostala roba, radovi i usluge", kind:"direct"},
      {code:"E", name:"Neizravni troškovi (25 %)", kind:"indirect", rate:0.25, base:["A","C.1","C.2","C.3"]}
    ],
    reporting: { periodMonths: 18, deadlineDays: 60 },
    deliverableTypes: ["R","DEM","DEC","DATA","OTHER"], dissemination: ["PU","SEN"],
    consortium: { minPartners: 3, minCountries: 3 }
  },
  "npoo-2021-2026": {
    name: "NPOO 2021–2026 (ilustrativno)", version: "1.0.0", currency: "EUR",
    actionTypes: { BESPOVRATNA: {name:"Bespovratna sredstva", rate:100} },
    categories: [
      {code:"OS", name:"Troškovi osoblja", kind:"direct"},
      {code:"VU", name:"Vanjske usluge", kind:"direct"},
      {code:"OP", name:"Oprema", kind:"direct"},
      {code:"PUT", name:"Putovanja", kind:"direct"},
      {code:"UP", name:"Upravljanje projektom (≤ 10 %)", kind:"direct", maxShare:0.10},
      {code:"NT", name:"Neizravni troškovi (15 % osoblja)", kind:"indirect", rate:0.15, base:["OS"]}
    ],
    reporting: { periodMonths: 3, deadlineDays: 30 },
    deliverableTypes: ["ISP","POK"], dissemination: ["JAV","INT"],
    consortium: { minPartners: 1, minCountries: 1 }
  }
};

/* ====== Demo podaci ====== */
const ORGS = [
  {id:"o1", name:"Fakultet prometnih znanosti, Sveučilište u Zagrebu", country:"HR", type:"sveučilište", self:true, nonProfit:true},
  {id:"o2", name:"Politecnico di Milano", country:"IT", type:"sveučilište", nonProfit:true},
  {id:"o3", name:"Fraunhofer IVI", country:"DE", type:"institut", nonProfit:true},
  {id:"o4", name:"Mobility Labs d.o.o.", country:"HR", type:"MSP", nonProfit:false},
  {id:"o5", name:"Univerza v Ljubljani", country:"SI", type:"sveučilište", nonProfit:true},
  {id:"o6", name:"Grad Zagreb", country:"HR", type:"javno tijelo", nonProfit:true},
  {id:"o7", name:"Hrvatske ceste d.o.o.", country:"HR", type:"javno poduzeće", nonProfit:false}
];
function seed(){
  return {
    calls: [
      {id:"c1", pkg:"horizon-europe-2021-2027", programme:"Horizon Europe", code:"HORIZON-CL5-2027-D6-01-03", title:"Resilient and safe multimodal transport systems in cities", action:"RIA", budget:12000000, projects:3, opens:"2027-01-14", deadline:"2027-04-22", status:"najavljen", url:"https://ec.europa.eu/info/funding-tenders/", tags:["prometni sustavi","urbana mobilnost","TRL 4–6"], fit:null, decision:null},
      {id:"c2", pkg:"horizon-europe-2021-2027", programme:"Horizon Europe", code:"HORIZON-CL5-2026-D6-02-07", title:"AI-enabled logistics for zero-emission freight", action:"IA", budget:20000000, projects:4, opens:"2026-09-10", deadline:"2027-01-20", status:"otvoren", url:"https://ec.europa.eu/info/funding-tenders/", tags:["logistika","AI","TRL 6–8"], fit:null, decision:null},
      {id:"c3", pkg:"npoo-2021-2026", programme:"NPOO", code:"NPOO.C3.2.R2-I1.05", title:"Razvoj istraživačkih kapaciteta za zelenu i digitalnu tranziciju prometa", action:"BESPOVRATNA", budget:15000000, projects:10, opens:"2026-10-01", deadline:"2026-12-15", status:"otvoren", url:"https://fondovieu.gov.hr/", tags:["istraživačka infrastruktura","digitalizacija"], fit:null, decision:null},
      {id:"c4", pkg:"horizon-europe-2021-2027", programme:"Horizon Europe (MSCA)", code:"HORIZON-MSCA-2026-SE-01", title:"MSCA Staff Exchanges 2026", action:"CSA", budget:90000000, projects:80, opens:"2026-10-08", deadline:"2026-10-29", status:"zatvoren", url:"https://ec.europa.eu/info/funding-tenders/", tags:["mobilnost osoblja"], fit:null, decision:null}
    ],
    proposals: [], projects: [], seq: 1
  };
}
/* ====== Stanje ====== */
const KEY="arqus-prototip-v1";
let S = load();
function load(){ try{ const s=localStorage.getItem(KEY); if(s) return JSON.parse(s);}catch(e){} return seed(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function nid(p){ return p + (S.seq++); }
const fmt = n => new Intl.NumberFormat('hr-HR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n||0);
const fd = d => d ? new Date(d).toLocaleDateString('hr-HR') : '–';
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
function addMonths(d, m){ const x=new Date(d); x.setMonth(x.getMonth()+m); return x.toISOString().slice(0,10); }
function addDays(d, n){ const x=new Date(d); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); }
const org = id => ORGS.find(o=>o.id===id);
const call = id => S.calls.find(c=>c.id===id);
const PSTAT = ["ideja","u pripremi","interna provjera","predana","u evaluaciji","financirana","ugovorena"];
const PRSTAT = ["u ugovaranju","aktivan","u završetku","zatvoren"];

/* ====== Izračun proračuna (pravila iz paketa) ====== */
function calcBudget(pkgId, action, lines, members){
  const P = PACKAGES[pkgId]; const at = P.actionTypes[action] || {rate:100};
  const out = {partners:{}, total:0, requested:0, warnings:[]};
  members.forEach(m => {
    const direct = {}; let directSum=0;
    P.categories.filter(c=>c.kind==='direct').forEach(c=>{ const v = +(lines[m.orgId]?.[c.code]||0); direct[c.code]=v; directSum+=v; });
    let indirect=0; P.categories.filter(c=>c.kind==='indirect').forEach(c=>{ indirect += c.rate * c.base.reduce((a,b)=>a+(direct[b]||0),0); });
    const total = directSum + indirect;
    const o = org(m.orgId); const rate = (o && o.nonProfit && at.rateNonProfit) ? at.rateNonProfit : at.rate;
    const requested = Math.round(total * rate/100);
    out.partners[m.orgId] = {direct, directSum, indirect, total, rate, requested};
    out.total += total; out.requested += requested;
    P.categories.forEach(c=>{
      if(c.warnShare && direct[c.code] > c.warnShare*directSum && directSum>0) out.warnings.push(`${o?.name}: ${c.name} > ${c.warnShare*100} % izravnih troškova – obrazložiti.`);
      if(c.maxShare && direct[c.code] > c.maxShare*directSum && directSum>0) out.warnings.push(`${o?.name}: ${c.name} prelazi dopuštenih ${c.maxShare*100} %.`);
    });
  });
  return out;
}

/* ====== Usmjeravanje ====== */
window.addEventListener('hashchange', render); window.addEventListener('load', ()=>{ if(!location.hash) location.hash='#/radar'; render(); });
document.getElementById('reset').onclick = ()=>{ if(confirm('Vratiti demo podatke? Sve unesene prijave i projekti se brišu.')){ S=seed(); save(); location.hash='#/radar'; render(); } };
function render(){
  const [_, page, id, tab] = location.hash.split('/');
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active', a.getAttribute('href')==='#/'+page));
  const app = document.getElementById('app');
  const views = {radar: id ? callDetail : radar, prijave: id ? proposalDetail : proposals, projekti: id ? projectDetail : projects, portfelj: portfolio};
  const ae = document.activeElement; const focusKey = ae && ae.dataset && ae.dataset.bind ? ae.dataset.bind : null; const selStart = ae && ae.selectionStart;
  app.innerHTML = (views[page]||radar)(id, tab||'');
  bind(app);
  if (focusKey) { const el = app.querySelector(`[data-bind="${focusKey}"]`); if (el) { el.focus(); try { if (selStart != null && el.setSelectionRange) el.setSelectionRange(selStart, selStart); } catch(e){} } }
}
function bind(root){
  root.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>location.hash=el.dataset.go);
  root.querySelectorAll('[data-act]').forEach(el=>el.onclick=e=>{ e.preventDefault(); ACT[el.dataset.act](el.dataset); });
  root.querySelectorAll('[data-bind]').forEach(el=>el.onchange=()=>{ ACT.bindField(el, true); setTimeout(render, 0); });
}

/* ====== Radar ====== */
function fitTotal(f){ return f ? Math.round(((f.strateg+f.kapacitet+f.vjerojatnost+f.financije)/20)*100) : null; }
function statusChip(s){ const cls = {otvoren:'ok',najavljen:'',zatvoren:'warn',otkazan:'bad', financirana:'ok', odbijena:'bad', 'rezervna lista':'warn', aktivan:'ok', zatvoren:'', ugovorena:'ok'}[s]||''; return `<span class="chip ${cls}">${esc(s)}</span>`; }
function radar(){
  const rows = S.calls.map(c=>{ const f=fitTotal(c.fit); const p=S.proposals.find(p=>p.callId===c.id);
    return `<tr class="row" data-go="#/radar/${c.id}"><td><b>${esc(c.code)}</b><br><span class="note">${esc(c.programme)} · ${esc(c.action)}</span></td><td>${esc(c.title)}<br><span class="note">${c.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join(' ')}</span></td><td>${fd(c.deadline)}</td><td class="num">${fmt(c.budget)}<br><span class="note">~${fmt(c.budget/c.projects)} / projekt</span></td><td>${statusChip(c.status)}</td><td>${f===null?'<span class="note">nije ocijenjen</span>':`<span class="chip ${f>=70?'ok':f>=50?'warn':'bad'}">${f} %</span>`}</td><td>${c.decision?`<span class="chip ${c.decision==='go'?'acc':''}">${esc(c.decision)}</span>`:''}${p?` <a href="#/prijave/${p.id}" class="note">→ prijava</a>`:''}</td></tr>`; }).join('');
  return `<h1>Radar poziva</h1><p class="sub">Pozivi iz javnih izvora (Funding &amp; Tenders Portal, fondovieu) i ručno uneseni. Klikni poziv za ocjenu prikladnosti i odluku go/no-go.</p>
  <div class="card"><table><thead><tr><th>Poziv</th><th>Tema</th><th>Rok</th><th class="num">Proračun poziva</th><th>Status</th><th>Prikladnost</th><th>Odluka</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="card"><h3>Dodaj poziv ručno</h3><div class="grid g4"><input id="nc-code" placeholder="Identifikator (npr. HRZZ-IP-2027)"><input id="nc-title" placeholder="Naslov"><select id="nc-pkg">${Object.entries(PACKAGES).map(([k,v])=>`<option value="${k}">${esc(v.name)}</option>`).join('')}</select><input id="nc-deadline" type="date"></div><div class="actions"><button class="primary" data-act="addCall">Dodaj</button></div></div>`;
}
function callDetail(id){
  const c = call(id); if(!c) return '<p>Poziv nije pronađen.</p>';
  const f = c.fit || {strateg:3,kapacitet:3,vjerojatnost:3,financije:3}; const tot=fitTotal(c.fit); const p=S.proposals.find(p=>p.callId===c.id); const P=PACKAGES[c.pkg];
  const crit = [["strateg","Strateško uklapanje"],["kapacitet","Kapacitet tima"],["vjerojatnost","Vjerojatnost uspjeha"],["financije","Financijski učinak"]];
  return `<div class="crumbs"><a href="#/radar">Radar poziva</a> › ${esc(c.code)}</div><h1>${esc(c.title)}</h1><p class="sub">${esc(c.programme)} · ${esc(c.code)} · ${statusChip(c.status)}</p>
  <div class="grid g2"><div class="card"><h3>Podaci o pozivu</h3><div class="kv"><b>Vrsta akcije</b><span>${esc(c.action)} – ${esc(P.actionTypes[c.action]?.name||'')} (stopa ${P.actionTypes[c.action]?.rate} %)</span><b>Paket programa</b><span>${esc(P.name)} v${P.version}</span><b>Otvaranje</b><span>${fd(c.opens)}</span><b>Rok predaje</b><span>${fd(c.deadline)}</span><b>Proračun poziva</b><span>${fmt(c.budget)} (~${c.projects} projekata)</span><b>Izvor</b><span><a href="${esc(c.url)}" target="_blank">${esc(c.url)}</a></span></div></div>
  <div class="card"><h3>Ocjena prikladnosti</h3>${crit.map(([k,l])=>`<div class="range"><span style="width:170px">${l}</span><input type="range" min="1" max="5" value="${f[k]}" data-bind="fit.${k}" data-call="${c.id}"><b id="fv-${k}">${f[k]}</b></div>`).join('')}
  <p>Ukupno: <b>${tot===null?'–':tot+' %'}</b> ${tot!==null?`<span class="chip ${tot>=70?'ok':tot>=50?'warn':'bad'}">${tot>=70?'preporuka: go':tot>=50?'razmotriti':'preporuka: no-go'}</span>`:''}</p>
  <div class="actions"><button class="primary" data-act="decide" data-call="${c.id}" data-d="go" ${c.decision==='go'?'disabled':''}>Go → otvori prijavu</button><button data-act="decide" data-call="${c.id}" data-d="pratiti">Pratiti</button><button class="danger" data-act="decide" data-call="${c.id}" data-d="no-go">No-go</button></div>
  ${c.decision?`<p class="note">Odluka: <b>${esc(c.decision)}</b> (${fd(c.decidedAt)})${p?` · <a href="#/prijave/${p.id}">prijava ${esc(p.acronym)}</a>`:''}</p>`:''}</div></div>`;
}

/* ====== Prijave ====== */
function proposals(){
  if(!S.proposals.length) return `<h1>Prijave</h1><p class="sub">Još nema prijava. Prijava nastaje odlukom <b>go</b> u <a href="#/radar">radaru poziva</a>.</p>`;
  return `<h1>Prijave</h1><p class="sub">Priprema prijava: konzorcij, struktura rada, proračun po pravilima paketa, predaja i ishod.</p><div class="card"><table><thead><tr><th>Akronim</th><th>Poziv</th><th>Uloga</th><th>Partneri</th><th class="num">Zatraženo</th><th>Rok</th><th>Status</th></tr></thead><tbody>
  ${S.proposals.map(p=>{ const c=call(p.callId); const b=calcBudget(p.pkg,p.action,p.lines,p.members); return `<tr class="row" data-go="#/prijave/${p.id}"><td><b>${esc(p.acronym)}</b><br><span class="note">${esc(p.title)}</span></td><td>${esc(c?.code)}</td><td>${esc(p.role)}</td><td>${p.members.length}</td><td class="num">${fmt(b.requested)}</td><td>${fd(c?.deadline)}</td><td>${statusChip(p.status)}</td></tr>`; }).join('')}</tbody></table></div>`;
}
function stepper(list, cur){ const i=list.indexOf(cur); return `<div class="steps">${list.map((s,j)=>`<span class="${j<i?'done':j===i?'cur':''}">${j<i?'✓ ':''}${s}</span>`).join('')}</div>`; }
function proposalDetail(id, tab){
  const p = S.proposals.find(x=>x.id===id); if(!p) return '<p>Prijava nije pronađena.</p>';
  const c = call(p.callId); const P = PACKAGES[p.pkg]; const b = calcBudget(p.pkg,p.action,p.lines,p.members); tab = tab||'osnovno';
  const locked = p.status!=='ideja' && p.status!=='u pripremi'; const budgetLocked = p.budgetLocked || locked;
  const tabs = [["osnovno","Osnovno"],["konzorcij",`Konzorcij (${p.members.length})`],["rad",`Struktura rada (${p.wps.length})`],["proracun","Proračun"],["predaja","Predaja i ishod"]];
  let body='';
  if(tab==='osnovno'){
    body = `<div class="grid g2"><div class="card"><div class="kv"><b>Akronim</b><span><input data-bind="acronym" data-pid="${p.id}" value="${esc(p.acronym)}" ${locked?'disabled':''}></span><b>Naslov</b><span><input style="width:100%" data-bind="title" data-pid="${p.id}" value="${esc(p.title)}" ${locked?'disabled':''}></span><b>Poziv</b><span><a href="#/radar/${c.id}">${esc(c.code)}</a> · rok ${fd(c.deadline)}</span><b>Paket programa</b><span>${esc(P.name)} v${P.version}</span><b>Vrsta akcije</b><span>${esc(p.action)}</span><b>Uloga stanara</b><span><select data-bind="role" data-pid="${p.id}" ${locked?'disabled':''}><option ${p.role==='koordinator'?'selected':''}>koordinator</option><option ${p.role==='partner'?'selected':''}>partner</option></select></span><b>Voditelj prijave</b><span><input data-bind="lead" data-pid="${p.id}" value="${esc(p.lead)}" ${locked?'disabled':''}></span><b>Interni rok</b><span><input type="date" data-bind="internalDeadline" data-pid="${p.id}" value="${p.internalDeadline||''}" ${locked?'disabled':''}> <span class="note">(preporuka: 5 dana prije roka poziva)</span></span></div></div>
    <div class="card"><h3>Provjera spremnosti</h3>${readiness(p,b,P).map(r=>`<div>${r.ok?'<span class="chip ok">✓</span>':'<span class="chip bad">✗</span>'} ${r.t}</div>`).join('')}</div></div>`;
  } else if(tab==='konzorcij'){
    body = `<div class="card"><table><thead><tr><th>#</th><th>Organizacija</th><th>Država</th><th>Vrsta</th><th>Uloga</th><th>Potvrda</th><th></th></tr></thead><tbody>${p.members.map((m,i)=>{const o=org(m.orgId); return `<tr><td>${i+1}</td><td>${esc(o.name)}</td><td>${o.country}</td><td>${esc(o.type)}</td><td>${esc(m.role)}</td><td>${locked?statusChip(m.confirmed?'potvrđen':'pozvan'):`<select data-bind="member.${m.orgId}.confirmed" data-pid="${p.id}"><option value="0" ${!m.confirmed?'selected':''}>pozvan</option><option value="1" ${m.confirmed?'selected':''}>potvrđen</option></select>`}</td><td>${locked||o.self?'':`<button data-act="removeMember" data-pid="${p.id}" data-org="${m.orgId}">ukloni</button>`}</td></tr>`;}).join('')}</tbody></table>
    ${locked?'':`<div class="actions"><select id="add-org">${ORGS.filter(o=>!p.members.some(m=>m.orgId===o.id)).map(o=>`<option value="${o.id}">${esc(o.name)} (${o.country})</option>`).join('')}</select><select id="add-role"><option>partner</option><option>pridruženi partner</option><option>podugovaratelj</option></select><button class="primary" data-act="addMember" data-pid="${p.id}">Dodaj partnera</button></div>`}
    <p class="note">Pravilo paketa: najmanje ${P.consortium.minPartners} partnera iz ${P.consortium.minCountries} država. Trenutno: ${p.members.length} partnera, ${new Set(p.members.map(m=>org(m.orgId).country)).size} država.</p></div>`;
  } else if(tab==='rad'){
    body = `<div class="card"><table><thead><tr><th>WP</th><th>Naziv</th><th>Voditelj</th><th>Mjeseci</th><th class="num">PM ukupno</th><th></th></tr></thead><tbody>${p.wps.map((w,i)=>`<tr><td>WP${i+1}</td><td>${locked?esc(w.name):`<input style="width:100%" data-bind="wp.${i}.name" data-pid="${p.id}" value="${esc(w.name)}">`}</td><td>${locked?esc(org(w.leadOrg)?.name):`<select data-bind="wp.${i}.leadOrg" data-pid="${p.id}">${p.members.map(m=>`<option value="${m.orgId}" ${w.leadOrg===m.orgId?'selected':''}>${esc(org(m.orgId).name)}</option>`).join('')}</select>`}</td><td>${locked?`${w.from}–${w.to}`:`<input type="number" style="width:60px" data-bind="wp.${i}.from" data-pid="${p.id}" value="${w.from}">–<input type="number" style="width:60px" data-bind="wp.${i}.to" data-pid="${p.id}" value="${w.to}">`}</td><td class="num">${locked?w.pm:`<input type="number" data-bind="wp.${i}.pm" data-pid="${p.id}" value="${w.pm}">`}</td><td>${locked?'':`<button data-act="removeWp" data-pid="${p.id}" data-i="${i}">ukloni</button>`}</td></tr>`).join('')}</tbody></table>${locked?'':`<div class="actions"><button class="primary" data-act="addWp" data-pid="${p.id}">Dodaj radni paket</button></div>`}<p class="note">Trajanje prijave: <input type="number" style="width:70px" data-bind="duration" data-pid="${p.id}" value="${p.duration}" ${locked?'disabled':''}> mjeseci. Zadaci, isporuke i prekretnice dodaju se u projektu nakon ugovaranja (prototip).</p></div>`;
  } else if(tab==='proracun'){
    const direct = P.categories.filter(c=>c.kind==='direct'), indirect=P.categories.filter(c=>c.kind==='indirect');
    body = `<div class="card"><p class="note">Stavke: partner × kategorija troška iz paketa <b>${esc(P.name)}</b>. Neizravni troškovi i zatraženi doprinos izračunavaju se iz pravila paketa (invarijanta 4). Verzija proračuna: v${p.budgetVersion}${budgetLocked?' · <span class="chip ok">zaključan</span>':' · <span class="chip warn">nacrt</span>'}</p>
    <div style="overflow:auto"><table><thead><tr><th>Partner</th>${direct.map(c=>`<th class="num">${esc(c.code)}<br><span class="note">${esc(c.name)}</span></th>`).join('')}${indirect.map(c=>`<th class="num">${esc(c.code)}<br><span class="note">${esc(c.name)}</span></th>`).join('')}<th class="num">Ukupno</th><th class="num">Stopa</th><th class="num">Zatraženo</th></tr></thead><tbody>
    ${p.members.map(m=>{const r=b.partners[m.orgId]; return `<tr><td>${esc(org(m.orgId).name)}</td>${direct.map(c=>`<td class="num">${budgetLocked?fmt(r.direct[c.code]):`<input type="number" step="1000" min="0" data-bind="line.${m.orgId}.${c.code}" data-pid="${p.id}" value="${r.direct[c.code]||''}">`}</td>`).join('')}<td class="num">${fmt(r.indirect)}</td><td class="num"><b>${fmt(r.total)}</b></td><td class="num">${r.rate} %</td><td class="num"><b>${fmt(r.requested)}</b></td></tr>`;}).join('')}
    <tr><td><b>Ukupno</b></td>${direct.map(c=>`<td class="num">${fmt(p.members.reduce((a,m)=>a+(b.partners[m.orgId].direct[c.code]||0),0))}</td>`).join('')}<td class="num">${fmt(p.members.reduce((a,m)=>a+b.partners[m.orgId].indirect,0))}</td><td class="num"><b>${fmt(b.total)}</b></td><td></td><td class="num"><b>${fmt(b.requested)}</b></td></tr></tbody></table></div>
    ${b.warnings.map(w=>`<p class="note"><span class="chip warn">upozorenje</span> ${esc(w)}</p>`).join('')}
    <p class="note">Okvir poziva: ~${fmt(c.budget/c.projects)} po projektu${b.requested > c.budget/c.projects*1.2 ? ' – <span class="chip warn">zatraženo je znatno iznad okvira</span>':''}.</p>
    <div class="actions">${budgetLocked ? (locked?'':`<button data-act="unlockBudget" data-pid="${p.id}">Otključaj (nova verzija v${p.budgetVersion+1})</button>`) : `<button class="primary" data-act="lockBudget" data-pid="${p.id}">Zaključaj proračun v${p.budgetVersion}</button>`}</div></div>`;
  } else if(tab==='predaja'){
    const ready = readiness(p,b,P).every(r=>r.ok);
    body = `<div class="grid g2"><div class="card"><h3>Predaja</h3>${p.submission?`<div class="kv"><b>Predano</b><span>${fd(p.submission.at)}</span><b>Portal</b><span>${esc(p.submission.portal)}</span><b>Referentni broj</b><span>${esc(p.submission.ref)}</span><b>Snimka proračuna</b><span>v${p.submission.budgetVersion} · ${fmt(p.submission.requested)} zatraženo</span></div>`:`<p class="note">Predaja zahtijeva zaključan proračun i potvrđene sve članove konzorcija.</p><div class="actions"><button data-act="setStatus" data-pid="${p.id}" data-s="u pripremi" ${p.status!=='ideja'?'disabled':''}>Započni pripremu</button><button data-act="setStatus" data-pid="${p.id}" data-s="interna provjera" ${p.status!=='u pripremi'?'disabled':''}>Pošalji na internu provjeru</button><button class="primary" data-act="submit" data-pid="${p.id}" ${!(ready && p.status==='interna provjera')?'disabled':''}>Predaj (zabilježi predaju)</button></div>`}</div>
    <div class="card"><h3>Ishod evaluacije</h3>${p.outcome?`<div class="kv"><b>Ishod</b><span>${statusChip(p.outcome.result)}</span><b>Bodovi</b><span>${esc(p.outcome.score)}</span><b>Datum</b><span>${fd(p.outcome.at)}</span></div>${p.status==='financirana'?`<div class="actions"><button class="primary" data-act="contract" data-pid="${p.id}">Ugovaranje → stvori projekt</button></div><p class="note">Ugovaranje kopira partnere, radne pakete i zaključani proračun u projekt (ADR-0006); prijava postaje arhiv.</p>`:''}${p.projectId?`<p><a href="#/projekti/${p.projectId}">→ projekt</a></p>`:''}`:(p.submission?`<div class="actions"><input id="score" placeholder="bodovi, npr. 13,5/15" style="width:160px"><button data-act="outcome" data-pid="${p.id}" data-r="financirana" class="primary">Financirana</button><button data-act="outcome" data-pid="${p.id}" data-r="rezervna lista">Rezervna lista</button><button data-act="outcome" data-pid="${p.id}" data-r="odbijena" class="danger">Odbijena</button></div>`:'<p class="note">Dostupno nakon predaje.</p>')}</div></div>`;
  }
  return `<div class="crumbs"><a href="#/prijave">Prijave</a> › ${esc(p.acronym)}</div><h1>${esc(p.acronym)} <span class="note" style="font-weight:400;font-size:15px">${esc(p.title)}</span></h1>${stepper(PSTAT, p.status==='odbijena'||p.status==='rezervna lista'?'u evaluaciji':p.status)}${p.status==='odbijena'||p.status==='rezervna lista'?`<p>${statusChip(p.status)}</p>`:''}
  <div class="tabs">${tabs.map(([k,l])=>`<a href="#/prijave/${p.id}/${k}" class="${tab===k?'active':''}">${l}</a>`).join('')}</div>${body}`;
}
function readiness(p,b,P){
  const countries = new Set(p.members.map(m=>org(m.orgId).country)).size;
  return [
    {ok:p.members.length>=P.consortium.minPartners && countries>=P.consortium.minCountries, t:`Konzorcij: ≥ ${P.consortium.minPartners} partnera iz ≥ ${P.consortium.minCountries} država`},
    {ok:p.members.every(m=>m.confirmed), t:"Svi članovi konzorcija potvrđeni"},
    {ok:p.wps.length>=1, t:"Barem jedan radni paket"},
    {ok:b.total>0, t:"Proračun unesen"},
    {ok:!!p.budgetLocked, t:"Proračun zaključan"},
    {ok:!!p.lead, t:"Voditelj prijave određen"}
  ];
}

function projects(){
  if(!S.projects.length) return `<h1>Projekti</h1><p class="sub">Još nema projekata. Projekt nastaje ugovaranjem financirane <a href="#/prijave">prijave</a> ili izravnim unosom (prototip: samo ugovaranjem).</p>`;
  return `<h1>Projekti</h1><div class="card"><table><thead><tr><th>Akronim</th><th>Program</th><th>Ugovor</th><th>Trajanje</th><th class="num">Proračun</th><th class="num">Doprinos</th><th class="num">Potrošeno</th><th>Status</th></tr></thead><tbody>${S.projects.map(pr=>`<tr class="row" data-go="#/projekti/${pr.id}"><td><b>${esc(pr.acronym)}</b><br><span class="note">${esc(pr.title)}</span></td><td>${esc(PACKAGES[pr.pkg].name)}</td><td>${esc(pr.contractNo||'–')}</td><td>${fd(pr.start)} – ${fd(addMonths(pr.start,pr.duration))}</td><td class="num">${fmt(pr.budget.total)}</td><td class="num">${fmt(pr.budget.requested)}</td><td class="num">${fmt(pr.expenses.reduce((a,e)=>a+e.amount,0))}</td><td>${statusChip(pr.status)}</td></tr>`).join('')}</tbody></table></div>`;
}
function projectDetail(id, tab){
  const pr = S.projects.find(x=>x.id===id); if(!pr) return '<p>Projekt nije pronađen.</p>'; const P=PACKAGES[pr.pkg]; tab=tab||'pregled';
  const spent = pr.expenses.reduce((a,e)=>a+e.amount,0); const own = pr.budget.partners[ORGS.find(o=>o.self).id];
  const tabs=[["pregled","Pregled"],["struktura",`Struktura rada (${pr.wps.length} WP)`],["proracun","Proračun i troškovi"],["izvjestavanje",`Izvještavanje (${pr.periods.length})`]];
  let body='';
  if(tab==='pregled'){
    body = `<div class="grid g4"><div class="tile"><div class="v">${fmt(pr.budget.total)}</div><div class="l">ukupni proračun</div></div><div class="tile"><div class="v">${fmt(pr.budget.requested)}</div><div class="l">doprinos financijera</div></div><div class="tile"><div class="v">${own?fmt(own.total):'–'}</div><div class="l">proračun stanara</div></div><div class="tile"><div class="v">${own?Math.round(spent/own.total*100):0} %</div><div class="l">potrošeno od proračuna stanara</div></div></div>
    <div class="grid g2" style="margin-top:14px"><div class="card"><h3>Ugovor</h3><div class="kv"><b>Broj ugovora</b><span><input data-bind="contractNo" data-prid="${pr.id}" value="${esc(pr.contractNo||'')}" placeholder="npr. 101234567"></span><b>Početak</b><span><input type="date" data-bind="start" data-prid="${pr.id}" value="${pr.start}"></span><b>Trajanje</b><span><input type="number" style="width:70px" data-bind="duration" data-prid="${pr.id}" value="${pr.duration}"> mj. → kraj ${fd(addMonths(pr.start,pr.duration))}</span><b>Uloga stanara</b><span>${esc(pr.role)}</span><b>Izvor</b><span>${pr.sourceProposalId?`<a href="#/prijave/${pr.sourceProposalId}">prijava (arhiv)</a>`:'izravni unos'}</span><b>Paket programa</b><span>${esc(P.name)} v${P.version}</span></div>
    <div class="actions">${pr.status==='u ugovaranju'?`<button class="primary" data-act="activate" data-prid="${pr.id}" ${!pr.contractNo?'disabled':''}>Aktiviraj projekt</button><span class="note">${!pr.contractNo?'Potreban je broj ugovora.':'Generira izvještajna razdoblja iz paketa.'}</span>`:pr.status==='aktivan'?`<button data-act="prStatus" data-prid="${pr.id}" data-s="u završetku">U završetku</button>`:pr.status==='u završetku'?`<button data-act="prStatus" data-prid="${pr.id}" data-s="zatvoren">Zatvori projekt</button>`:''}</div></div>
    <div class="card"><h3>Partneri (${pr.partners.length})</h3><table><thead><tr><th>Organizacija</th><th>Uloga</th><th class="num">Proračun</th><th class="num">Doprinos</th></tr></thead><tbody>${pr.partners.map(m=>{const r=pr.budget.partners[m.orgId]; return `<tr><td>${esc(org(m.orgId).name)}</td><td>${esc(m.role)}</td><td class="num">${fmt(r.total)}</td><td class="num">${fmt(r.requested)}</td></tr>`;}).join('')}</tbody></table></div></div>`;
  } else if(tab==='struktura'){
    body = pr.wps.map((w,i)=>`<div class="card"><h3>WP${i+1} ${esc(w.name)} <span class="note">· ${esc(org(w.leadOrg)?.name)} · M${w.from}–M${w.to} · ${w.pm} PM</span></h3>
      <table><thead><tr><th>Isporuka</th><th>Naziv</th><th>Vrsta</th><th>Dis.</th><th>Rok (mj.)</th><th>Status</th></tr></thead><tbody>${(w.deliverables||[]).map((d,j)=>`<tr><td>D${i+1}.${j+1}</td><td>${esc(d.name)}</td><td>${esc(d.type)}</td><td>${esc(d.diss)}</td><td>M${d.month} <span class="note">(${fd(addMonths(pr.start,d.month))})</span></td><td><select data-bind="deliv.${i}.${j}.status" data-prid="${pr.id}">${["planirano","u izradi","predano","prihvaćeno"].map(s=>`<option ${d.status===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan="6" class="note">Nema isporuka.</td></tr>'}</tbody></table>
      <div class="actions"><input id="dn-${i}" placeholder="Naziv isporuke"><select id="dt-${i}">${P.deliverableTypes.map(t=>`<option>${t}</option>`).join('')}</select><select id="dd-${i}">${P.dissemination.map(t=>`<option>${t}</option>`).join('')}</select><input id="dm-${i}" type="number" style="width:70px" placeholder="mj." value="${w.to}"><button data-act="addDeliv" data-prid="${pr.id}" data-i="${i}">Dodaj isporuku</button></div></div>`).join('') +
      `<div class="card"><h3>Prekretnice</h3><table><tbody>${pr.milestones.map((m,i)=>`<tr><td>MS${i+1}</td><td>${esc(m.name)}</td><td>M${m.month}</td><td>${esc(m.verify)}</td></tr>`).join('')||'<tr><td class="note">Nema prekretnica.</td></tr>'}</tbody></table><div class="actions"><input id="ms-name" placeholder="Naziv"><input id="ms-month" type="number" style="width:70px" placeholder="mj."><input id="ms-verify" placeholder="Način provjere"><button data-act="addMs" data-prid="${pr.id}">Dodaj prekretnicu</button></div></div>`;
  } else if(tab==='proracun'){
    const cats = P.categories; const self = ORGS.find(o=>o.self).id; const r = pr.budget.partners[self];
    const spentBy = code => pr.expenses.filter(e=>e.cat===code).reduce((a,e)=>a+e.amount,0);
    body = `<div class="card"><h3>Proračun stanara v${pr.budget.version} (ugovoreni) vs. ostvareno</h3><table><thead><tr><th>Kategorija</th><th class="num">Ugovoreno</th><th class="num">Ostvareno</th><th class="num">Preostalo</th><th class="num">%</th></tr></thead><tbody>${r?cats.map(c=>{const plan=c.kind==='indirect'?r.indirect:(r.direct[c.code]||0); const sp=c.kind==='indirect'?Math.round(c.rate*c.base.reduce((a,b)=>a+spentBy(b),0)):spentBy(c.code); return `<tr><td>${esc(c.code)} ${esc(c.name)}${c.kind==='indirect'?' <span class="note">(izračun)</span>':''}</td><td class="num">${fmt(plan)}</td><td class="num">${fmt(sp)}</td><td class="num">${fmt(plan-sp)}</td><td class="num">${plan?Math.round(sp/plan*100):0} %</td></tr>`;}).join(''):'<tr><td class="note">Stanar nije partner.</td></tr>'}</tbody></table></div>
    <div class="card"><h3>Troškovi stanara (${pr.expenses.length})</h3><table><thead><tr><th>Datum</th><th>Kategorija</th><th>Opis</th><th class="num">Iznos</th><th>Status</th></tr></thead><tbody>${pr.expenses.map(e=>`<tr><td>${fd(e.date)}</td><td>${esc(e.cat)}</td><td>${esc(e.desc)}</td><td class="num">${fmt(e.amount)}</td><td>${statusChip(e.status)}</td></tr>`).join('')||'<tr><td colspan="5" class="note">Nema troškova.</td></tr>'}</tbody></table>
    <div class="actions"><input id="ex-date" type="date" value="${new Date().toISOString().slice(0,10)}"><select id="ex-cat">${cats.filter(c=>c.kind==='direct').map(c=>`<option value="${c.code}">${c.code} ${esc(c.name)}</option>`).join('')}</select><input id="ex-desc" placeholder="Opis / dokaz (račun br.)"><input id="ex-amount" type="number" placeholder="iznos €"><button class="primary" data-act="addExpense" data-prid="${pr.id}">Evidentiraj trošak</button></div><p class="note">Neizravni troškovi se ne unose – računaju se iz paketa (invarijanta 4). Trošak ulazi u najviše jedan zahtjev za nadoknadu (invarijanta 6).</p></div>`;
  } else if(tab==='izvjestavanje'){
    body = `<div class="card"><p class="note">Razdoblja generirana iz paketa: ${P.reporting.periodMonths} mjeseci, rok predaje ${P.reporting.deadlineDays} dana nakon kraja razdoblja.</p><table><thead><tr><th>Razdoblje</th><th>Od – do</th><th>Rok predaje</th><th class="num">Troškovi u razdoblju</th><th>Zahtjev za nadoknadu</th><th>Izvještaj</th></tr></thead><tbody>${pr.periods.map((rp,i)=>{const sp=pr.expenses.filter(e=>e.date>=rp.from&&e.date<=rp.to).reduce((a,e)=>a+e.amount,0); return `<tr><td>RP${i+1}</td><td>${fd(rp.from)} – ${fd(rp.to)}</td><td>${fd(rp.due)}</td><td class="num">${fmt(sp)}</td><td><select data-bind="period.${i}.claim" data-prid="${pr.id}">${["nacrt","interna provjera","predan","u provjeri","odobren"].map(s=>`<option ${rp.claim===s?'selected':''}>${s}</option>`).join('')}</select></td><td><select data-bind="period.${i}.report" data-prid="${pr.id}">${["nacrt","interni pregled","predan","prihvaćen"].map(s=>`<option ${rp.report===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`;}).join('')||'<tr><td colspan="6" class="note">Razdoblja se generiraju aktivacijom projekta.</td></tr>'}</tbody></table></div>`;
  }
  return `<div class="crumbs"><a href="#/projekti">Projekti</a> › ${esc(pr.acronym)}</div><h1>${esc(pr.acronym)} <span class="note" style="font-weight:400;font-size:15px">${esc(pr.title)}</span></h1>${stepper(PRSTAT, pr.status)}<div class="tabs">${tabs.map(([k,l])=>`<a href="#/projekti/${pr.id}/${k}" class="${tab===k?'active':''}">${l}</a>`).join('')}</div>${body}`;
}

/* ====== Portfelj ====== */
function portfolio(){
  const open = S.calls.filter(c=>c.status==='otvoren'||c.status==='najavljen').length;
  const act = S.projects.filter(p=>p.status==='aktivan'); const sumB = act.reduce((a,p)=>a+p.budget.requested,0);
  const today = new Date().toISOString().slice(0,10);
  const dl = [...S.calls.filter(c=>c.deadline>=today && c.decision!=='no-go').map(c=>({d:c.deadline,t:`Rok poziva ${c.code}`,h:`#/radar/${c.id}`})), ...S.proposals.filter(p=>p.internalDeadline).map(p=>({d:p.internalDeadline,t:`Interni rok prijave ${p.acronym}`,h:`#/prijave/${p.id}`})), ...S.projects.flatMap(p=>p.periods.map((rp,i)=>({d:rp.due,t:`${p.acronym}: rok izvještaja RP${i+1}`,h:`#/projekti/${p.id}/izvjestavanje`}))), ...S.projects.flatMap(p=>p.wps.flatMap((w,i)=>(w.deliverables||[]).filter(d=>d.status!=='prihvaćeno').map((d,j)=>({d:addMonths(p.start,d.month),t:`${p.acronym}: D${i+1}.${j+1} ${d.name}`,h:`#/projekti/${p.id}/struktura`}))))].filter(x=>x.d>=today).sort((a,b)=>a.d.localeCompare(b.d)).slice(0,10);
  const byStatus = s => S.proposals.filter(p=>p.status===s).length;
  return `<h1>Portfelj institucije</h1><p class="sub">Agregirani pogled stanara: lijevak poziv → prijava → projekt, obveze i rokovi.</p>
  <div class="grid g4"><div class="tile"><div class="v">${open}</div><div class="l">otvorenih / najavljenih poziva</div></div><div class="tile"><div class="v">${S.proposals.filter(p=>!['financirana','ugovorena','odbijena'].includes(p.status)).length}</div><div class="l">prijava u pripremi/evaluaciji</div></div><div class="tile"><div class="v">${act.length}</div><div class="l">aktivnih projekata</div></div><div class="tile"><div class="v">${fmt(sumB)}</div><div class="l">ugovoreni doprinos (aktivni)</div></div></div>
  <div class="grid g2" style="margin-top:14px"><div class="card"><h3>Lijevak</h3><table><tbody><tr><td>Pozivi s odlukom go</td><td class="num">${S.calls.filter(c=>c.decision==='go').length}</td></tr><tr><td>Prijave u pripremi</td><td class="num">${byStatus('ideja')+byStatus('u pripremi')+byStatus('interna provjera')}</td></tr><tr><td>Predane / u evaluaciji</td><td class="num">${byStatus('predana')+byStatus('u evaluaciji')}</td></tr><tr><td>Financirane</td><td class="num">${byStatus('financirana')+byStatus('ugovorena')}</td></tr><tr><td>Odbijene / rezervna lista</td><td class="num">${byStatus('odbijena')+byStatus('rezervna lista')}</td></tr><tr><td>Projekti ukupno</td><td class="num">${S.projects.length}</td></tr></tbody></table></div>
  <div class="card"><h3>Nadolazeći rokovi</h3><table><tbody>${dl.map(x=>`<tr class="row" data-go="${x.h}"><td>${fd(x.d)}</td><td>${esc(x.t)}</td></tr>`).join('')||'<tr><td class="note">Nema rokova.</td></tr>'}</tbody></table></div></div>`;
}

/* ====== Radnje ====== */
const ACT = {
  bindField(el, deferRender){
    const path = el.dataset.bind.split('.'); let v = el.type==='checkbox' ? el.checked : el.value;
    const done = ()=>{ save(); if(!deferRender) render(); };
    if(el.dataset.call){ const c=call(el.dataset.call); c.fit = c.fit||{strateg:3,kapacitet:3,vjerojatnost:3,financije:3}; c.fit[path[1]]=+v; done(); return; }
    const p = el.dataset.pid ? S.proposals.find(x=>x.id===el.dataset.pid) : S.projects.find(x=>x.id===el.dataset.prid);
    if(path[0]==='line'){ (p.lines[path[1]] ||= {})[path[2]] = +v; }
    else if(path[0]==='member'){ p.members.find(m=>m.orgId===path[1]).confirmed = v==='1'; }
    else if(path[0]==='wp'){ p.wps[+path[1]][path[2]] = ['from','to','pm'].includes(path[2]) ? +v : v; }
    else if(path[0]==='deliv'){ p.wps[+path[1]].deliverables[+path[2]][path[3]] = v; }
    else if(path[0]==='period'){ p.periods[+path[1]][path[2]] = v; }
    else { p[path[0]] = ['duration'].includes(path[0]) ? +v : v; }
    done();
  },
  addCall(){ const code=val('nc-code'), title=val('nc-title'); if(!code||!title) return toast('Unesi identifikator i naslov.'); const pkg=val('nc-pkg'); S.calls.unshift({id:nid('c'),pkg,programme:PACKAGES[pkg].name,code,title,action:Object.keys(PACKAGES[pkg].actionTypes)[0],budget:0,projects:1,opens:null,deadline:val('nc-deadline')||null,status:'otvoren',url:'',tags:['ručni unos'],fit:null,decision:null}); save(); render(); toast('Poziv dodan.'); },
  decide(d){ const c=call(d.call); c.decision=d.d; c.decidedAt=new Date().toISOString().slice(0,10);
    if(d.d==='go' && !S.proposals.some(p=>p.callId===c.id)){ const self=ORGS.find(o=>o.self); const p={id:nid('p'),callId:c.id,pkg:c.pkg,action:c.action,acronym:'NOVA'+S.seq,title:c.title,role:'koordinator',lead:'',internalDeadline:c.deadline?addDays(c.deadline,-5):'',duration:36,status:'ideja',members:[{orgId:self.id,role:'koordinator',confirmed:true}],wps:[{name:'Upravljanje projektom',leadOrg:self.id,from:1,to:36,pm:12}],lines:{},budgetVersion:1,budgetLocked:false,submission:null,outcome:null,projectId:null}; S.proposals.push(p); save(); location.hash=`#/prijave/${p.id}`; toast('Prijava otvorena.'); return; }
    save(); render(); },
  addMember(d){ const p=S.proposals.find(x=>x.id===d.pid); const o=val('add-org'); if(!o) return; p.members.push({orgId:o,role:val('add-role'),confirmed:false}); save(); render(); },
  removeMember(d){ const p=S.proposals.find(x=>x.id===d.pid); p.members=p.members.filter(m=>m.orgId!==d.org); delete p.lines[d.org]; save(); render(); },
  addWp(d){ const p=S.proposals.find(x=>x.id===d.pid); p.wps.push({name:'Novi radni paket',leadOrg:p.members[0].orgId,from:1,to:p.duration,pm:0}); save(); render(); },
  removeWp(d){ const p=S.proposals.find(x=>x.id===d.pid); p.wps.splice(+d.i,1); save(); render(); },
  lockBudget(d){ const p=S.proposals.find(x=>x.id===d.pid); p.budgetLocked=true; save(); render(); toast(`Proračun v${p.budgetVersion} zaključan.`); },
  unlockBudget(d){ const p=S.proposals.find(x=>x.id===d.pid); p.budgetLocked=false; p.budgetVersion++; save(); render(); },
  setStatus(d){ const p=S.proposals.find(x=>x.id===d.pid); p.status=d.s; save(); render(); },
  submit(d){ const p=S.proposals.find(x=>x.id===d.pid); const b=calcBudget(p.pkg,p.action,p.lines,p.members); const c=call(p.callId); p.submission={at:new Date().toISOString().slice(0,10),portal:c.programme.startsWith('NPOO')?'fondovieu':'Funding & Tenders Portal',ref:'SEP-'+Math.floor(100000000+Math.random()*900000000),budgetVersion:p.budgetVersion,requested:b.requested}; p.status='predana'; setTimeout(()=>{p.status='u evaluaciji'; save(); render();},1200); save(); render(); toast('Predaja zabilježena.'); },
  outcome(d){ const p=S.proposals.find(x=>x.id===d.pid); p.outcome={result:d.r,score:val('score')||'–',at:new Date().toISOString().slice(0,10)}; p.status=d.r; save(); render(); },
  contract(d){ const p=S.proposals.find(x=>x.id===d.pid); const b=calcBudget(p.pkg,p.action,p.lines,p.members); const start=addMonths(new Date().toISOString().slice(0,10),2).slice(0,8)+'01';
    const pr={id:nid('pr'),sourceProposalId:p.id,pkg:p.pkg,action:p.action,acronym:p.acronym,title:p.title,role:p.role,contractNo:'',start,duration:p.duration,status:'u ugovaranju',partners:p.members.filter(m=>m.role!=='podugovaratelj').map(m=>({orgId:m.orgId,role:m.role})),wps:p.wps.map(w=>({...w,deliverables:[]})),milestones:[],budget:{version:1,...JSON.parse(JSON.stringify(b))},expenses:[],periods:[]};
    S.projects.push(pr); p.status='ugovorena'; p.projectId=pr.id; save(); location.hash=`#/projekti/${pr.id}`; toast('Projekt stvoren iz prijave (kopija proračuna v1).'); },
  activate(d){ const pr=S.projects.find(x=>x.id===d.prid); const P=PACKAGES[pr.pkg]; pr.periods=[]; for(let m=0;m<pr.duration;m+=P.reporting.periodMonths){ const from=addMonths(pr.start,m); const to=addDays(addMonths(pr.start,Math.min(m+P.reporting.periodMonths,pr.duration)),-1); pr.periods.push({from,to,due:addDays(to,P.reporting.deadlineDays),claim:'nacrt',report:'nacrt'}); } pr.status='aktivan'; save(); render(); toast(`Projekt aktivan, ${pr.periods.length} izvještajnih razdoblja.`); },
  prStatus(d){ const pr=S.projects.find(x=>x.id===d.prid); pr.status=d.s; save(); render(); },
  addDeliv(d){ const pr=S.projects.find(x=>x.id===d.prid); const i=+d.i; const n=val('dn-'+i); if(!n) return toast('Unesi naziv isporuke.'); pr.wps[i].deliverables.push({name:n,type:val('dt-'+i),diss:val('dd-'+i),month:+val('dm-'+i)||pr.wps[i].to,status:'planirano'}); save(); render(); },
  addMs(d){ const pr=S.projects.find(x=>x.id===d.prid); const n=val('ms-name'); if(!n) return toast('Unesi naziv.'); pr.milestones.push({name:n,month:+val('ms-month')||1,verify:val('ms-verify')}); save(); render(); },
  addExpense(d){ const pr=S.projects.find(x=>x.id===d.prid); const a=+val('ex-amount'); if(!a) return toast('Unesi iznos.'); pr.expenses.push({date:val('ex-date'),cat:val('ex-cat'),desc:val('ex-desc'),amount:a,status:'evidentiran'}); save(); render(); toast('Trošak evidentiran.'); }
};
const val = id => document.getElementById(id)?.value ?? '';
</script>
